<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planner for Canvas</title>
  <link rel="stylesheet" href="planner.css">
  <script type="module" src="planner.js"></script>
</head>
<body>
  <a class="skip-link" href="#days">Skip to the plan</a>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="content" id="content">
      <div class="main">
        <header id="header"></header>
        <div id="banners" role="status" aria-live="polite"></div>
        <main id="days" tabindex="-1"></main>
        <section id="extras"></section>
      </div>
      <aside class="rail" id="rail" aria-label="Overview"></aside>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
